apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: modbus-gas-sensor
  catalog: rtu-iiot
  labels:
    category: sensors
    protocol: modbus
spec:
  type: container
  displayName: Modbus Gas Flow Sensor Simulator
  shortDescription: Simulates RS485/Modbus gas flow sensor with DP, SP, and temperature measurements
  provider: RTU
  category: application

  artifacts:
    - type: container
      uri: quay.io/luferrar/rtu-modbus-gas-sensor

  versions:
    - version: "1.0.0"
      channels:
        - stable
      references:
        container: "1.0.0"
      readme: |
        # Modbus Gas Flow Sensor Simulator

        ## Overview
        This application simulates an industrial gas flow sensor connected via Modbus TCP protocol.
        It measures three critical parameters for gas flow calculation:

        ### Measured Parameters
        - **Differential Pressure (DP)**: Pressure drop across orifice plate (0-1000 Pa)
        - **Static Pressure (SP)**: Absolute gas pressure for volume correction (95-110 kPa)
        - **Temperature (T)**: Gas temperature for density correction (-10 to 60°C)
        - **Gas Flow**: Calculated flow rate (m³/h) using ISO 5167 orifice plate formula

        ### Modbus TCP Interface
        - **Port**: 502
        - **Protocol**: Modbus TCP (Ethernet)
        - **Slave ID**: 1

        ### Register Map
        | Register | Parameter | Unit | Format |
        |----------|-----------|------|--------|
        | 100 | Differential Pressure | Pa | int16 (×100) |
        | 101 | Static Pressure | Pa | int16 (×10) |
        | 102 | Temperature | °C | int16 (×100) |
        | 103 | Gas Flow | m³/h | int16 (×100) |

        ### Configuration
        The simulator reads `config.yaml` at startup; the following settings can be
        overridden at deploy time via environment variables (set them via the catalog's
        configurable defaults or a Fleet/Application override) without editing the image:
        - `INITIAL_DP`: Initial Differential Pressure in Pa (default: `50`)
        - `INITIAL_SP`: Initial Static Pressure in Pa (default: `101325`)
        - `INITIAL_TEMP`: Initial Temperature in Celsius (default: `20`)
        - `ORIFICE_DIAMETER`: Orifice diameter in meters (default: `0.05`)
        - `MODBUS_PORT`: Modbus TCP port (default: `502`)
        - `LOG_LEVEL`: Logging level - DEBUG, INFO, WARN, ERROR (default: `INFO`)

        The orifice discharge coefficient is not exposed as an environment variable;
        adjust it directly in `config.yaml` if needed.

        ### Formula Used
        ```
        Q = C × A × √(2 × DP / ρ)

        where:
          Q = Flow rate (m³/s)
          C = Discharge coefficient (0.61 for sharp-edged orifice)
          A = Orifice area (m²)
          DP = Differential pressure (Pa)
          ρ = Gas density (kg/m³), calculated from SP and T
        ```

  defaults:
    config:
      envVars:
        MODBUS_PORT: "502"
        LOG_LEVEL: "INFO"
        INITIAL_DP: "50"
        INITIAL_SP: "101325"
        INITIAL_TEMP: "20"
        ORIFICE_DIAMETER: "0.05"

      ports:
        - "502:502"

      resources:
        requests:
          memory: "64m"
          cpu: "0.1"
        limits:
          memory: "256m"
          cpu: "0.5"

    configSchema:
      $schema: "http://json-schema.org/draft-07/schema#"
      type: object
      title: Modbus Gas Sensor Configuration
      description: Configuration options for the Modbus gas flow sensor simulator
      properties:
        envVars:
          type: object
          title: Environment Variables
          description: Environment variables for configuring the sensor simulator
          properties:
            MODBUS_PORT:
              type: integer
              description: Modbus TCP port
              minimum: 1
              maximum: 65535
              default: 502
            LOG_LEVEL:
              type: string
              description: Logging level (DEBUG, INFO, WARN, ERROR)
              default: "INFO"
              enum: ["DEBUG", "INFO", "WARN", "ERROR"]
            INITIAL_DP:
              type: number
              description: Initial Differential Pressure in Pa
              minimum: 0
              maximum: 1000
              default: 50
            INITIAL_SP:
              type: number
              description: Initial Static Pressure in Pa
              minimum: 95000
              maximum: 110000
              default: 101325
            INITIAL_TEMP:
              type: number
              description: Initial Temperature in Celsius
              minimum: -10
              maximum: 60
              default: 20
            ORIFICE_DIAMETER:
              type: number
              description: Orifice diameter in meters
              default: 0.05
        ports:
          type: array
          title: Port Mappings
          description: List of port mappings for the sensor simulator
          items:
            type: string
            pattern: "^[0-9]+:[0-9]+$"
            default: "502:502"
        resources:
          type: object
          title: Resource Requests and Limits
          description: CPU and memory resource requests and limits for the sensor container
          properties:
            requests:
              type: object
              properties:
                memory:
                  type: string
                  description: Memory request (e.g., "64m")
                  default: "64m"
                cpu:
                  type: string
                  description: CPU request (e.g., "0.1")
                  default: "0.1"
            limits:
              type: object
              properties:
                memory:
                  type: string
                  description: Memory limit (e.g., "256m")
                  default: "256m"
                cpu:
                  type: string
                  description: CPU limit (e.g., "0.5")
                  default: "0.5"
        runAs:
          type: string
          title: Access & permissions
          description: >-
            Prevents this workload from modifying critical host operating system files.
            We recommend keeping rootless mode enabled. Use "flightctl" for rootless
            (recommended); use "root" to disable system integrity protection.
          default: root
          enum:
            - flightctl
            - root
