apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: modbus-mqtt-gateway
  catalog: rtu-iiot
  labels:
    category: gateways
    protocol: modbus-mqtt
spec:
  type: container
  displayName: Modbus to MQTT Gateway
  shortDescription: Translates Modbus sensor readings into MQTT topics for real-time monitoring
  provider: RTU
  category: application

  artifacts:
    - type: container
      uri: quay.io/luferrar/rtu-modbus-mqtt-gateway

  versions:
    - version: "1.0.0"
      channels:
        - stable
      references:
        container: "1.0.0"
      readme: |
        # Modbus to MQTT Gateway

        ## Overview
        This gateway bridges industrial Modbus devices (such as the Modbus Gas Sensor) with MQTT
        for cloud-native data collection and analysis. It continuously reads measurements from a
        Modbus device and publishes them to MQTT topics.

        ## Features
        - Real-time data polling from Modbus TCP devices
        - Automatic conversion from fixed-point to decimal values
        - Structured MQTT topic hierarchy
        - Configurable polling interval
        - Robust error handling and reconnection logic

        ## MQTT Topic Structure
        ```
        rtu/sensor/{device_id}/dp         - Differential Pressure (Pa)
        rtu/sensor/{device_id}/sp         - Static Pressure (Pa)
        rtu/sensor/{device_id}/temp       - Temperature (°C)
        rtu/sensor/{device_id}/flow       - Gas Flow (m³/h)
        rtu/sensor/{device_id}/timestamp  - Last reading timestamp (ISO 8601)
        rtu/sensor/{device_id}/status     - Full status JSON object
        ```

        ## Configuration
        The gateway reads `config.yaml` at startup; the following settings can be
        overridden at deploy time via environment variables (set them via the catalog's
        configurable defaults or a Fleet/Application override) without editing the image:
        - `MODBUS_HOST`: Hostname or IP of Modbus device (default: `modbus-gas-sensor`)
        - `MODBUS_PORT`: Modbus TCP port (default: `502`)
        - `MQTT_HOST`: Hostname or IP of MQTT broker (default: `mosquitto-broker`)
        - `MQTT_PORT`: MQTT port (default: `1883`)
        - `DEVICE_ID`: Unique device identifier (default: `sensor-001`)
        - `POLL_INTERVAL`: Reading interval in seconds (default: `5`)
        - `LOG_LEVEL`: Logging level - DEBUG, INFO, WARN, ERROR (default: `INFO`)

        The Modbus slave ID is not exposed as an environment variable; adjust it
        directly in `config.yaml` if needed.

        ## Service Dependencies
        - **Modbus Gas Sensor**: Must be running and accessible
        - **MQTT Broker**: Must be running and accessible

        ## Example Usage
        Subscribe to all measurements:
        ```bash
        mosquitto_sub -h mqtt-broker -t 'rtu/sensor/sensor-001/#' -v
        ```

        Subscribe to only flow rate:
        ```bash
        mosquitto_sub -h mqtt-broker -t 'rtu/sensor/sensor-001/flow' -v
        ```

  defaults:
    config:
      envVars:
        MODBUS_HOST: "modbus-gas-sensor"
        MODBUS_PORT: "502"
        MQTT_HOST: "mosquitto-broker"
        MQTT_PORT: "1883"
        DEVICE_ID: "sensor-001"
        POLL_INTERVAL: "5"
        LOG_LEVEL: "INFO"

      resources:
        requests:
          memory: "128m"
          cpu: "0.1"
        limits:
          memory: "256m"
          cpu: "0.5"

    configSchema:
      $schema: "http://json-schema.org/draft-07/schema#"
      type: object
      properties:
        envVars:
          type: object
          title: Environment Variables
          description: Environment variables for configuring the Modbus to MQTT gateway
          properties:
            MODBUS_HOST:
              type: string
              description: Modbus device hostname or IP address
              default: "modbus-gas-sensor"
              minLength: 1
            MODBUS_PORT:
              type: integer
              description: Modbus TCP port
              minimum: 1
              maximum: 65535
              default: 502
            MQTT_HOST:
              type: string
              description: MQTT broker hostname or IP address
              default: "mosquitto-broker"
              minLength: 1
            MQTT_PORT:
              type: integer
              description: MQTT port
              minimum: 1
              maximum: 65535
              default: 1883
            DEVICE_ID:
              type: string
              description: Unique device identifier
              default: "sensor-001"
              minLength: 1
            POLL_INTERVAL:
              type: integer
              description: Polling interval in seconds
              minimum: 1
              maximum: 3600
              default: 5
            LOG_LEVEL:
              type: string
              description: Logging level (DEBUG, INFO, WARN, ERROR)
              default: "INFO"
              enum: ["DEBUG", "INFO", "WARN", "ERROR"]
        resources:
          type: object
          title: Resource Requests and Limits
          description: CPU and memory resource requests and limits for the gateway container
          properties:
            requests:
              type: object
              properties:
                memory:
                  type: string
                  description: Memory request (e.g., "128m")
                  default: "128m"
                cpu:
                  type: string
                  description: CPU request (e.g., "0.1")
                  default: "0.1"
            limits:
              type: object
              properties:
                memory:
                  type: string
                  description: Memory limit (e.g., "256m")
                  default: "256m"
                cpu:
                  type: string
                  description: CPU limit (e.g., "0.5")
                  default: "0.5"
        runAs:
          type: string
          title: Access & permissions
          description: >-
            Prevents this workload from modifying critical host operating system files.
            We recommend keeping rootless mode enabled. Use "flightctl" for rootless
            (recommended); use "root" to disable system integrity protection.
          default: root
          enum:
            - flightctl
            - root