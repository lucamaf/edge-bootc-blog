apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: mosquitto-broker
  catalog: rtu-iiot
  labels:
    category: infrastructure
    protocol: mqtt
spec:
  type: container
  displayName: Mosquitto MQTT Broker
  shortDescription: Lightweight, open-source MQTT message broker for IoT communications
  provider: Eclipse Mosquitto
  category: application

  artifacts:
    - type: container
      uri: docker.io/eclipse-mosquitto

  versions:
    - version: "2.0.15"
      channels:
        - stable
      references:
        container: "2.0.15"
      readme: &mosquitto-readme |
        # Mosquitto MQTT Broker

        ## Overview
        Mosquitto is a popular open-source message broker that implements the MQTT protocol.
        It is lightweight, reliable, and ideal for IoT and edge computing environments.

        ## Key Features
        - **MQTT Protocol**: Full MQTT 3.1.1 and 5.0 support
        - **Lightweight**: Minimal resource footprint
        - **Scalable**: Handles thousands of concurrent connections
        - **Persistence**: Optional message persistence
        - **WebSocket Support**: For browser-based clients
        - **TLS/SSL Support**: Secure encrypted communications

        ## Connectivity
        - **Port 1883**: Standard MQTT protocol
        - **Port 8883**: MQTT over TLS/SSL
        - **Port 9001**: MQTT over WebSockets

        ## Configuration
        The broker's `mosquitto.conf` is generated at container startup from a template,
        substituting the following environment variables (set them via the catalog's
        configurable defaults or a Fleet/Application override):
        - `ALLOW_ANONYMOUS`: Allow anonymous MQTT connections (default: `true`)
        - `MAX_CONNECTIONS`: Maximum concurrent connections, `-1` for unlimited (default: `-1`)
        - `MAX_KEEPALIVE`: Maximum keep-alive interval in seconds (default: `60`)
        - `MAX_QUEUED_MESSAGES`: Maximum queued messages per client (default: `1000`)
        - `PERSISTENCE`: Enable message persistence at `/mosquitto/data/` (default: `true`)
        - `TZ`: Timezone for the container (default: `UTC`)

        ## Data Directories
        - `/mosquitto/data/`: Persistent message storage
        - `/mosquitto/log/`: Log files
        - `/mosquitto/config/`: Configuration files
        - `/mosquitto/certs/`: TLS certificates (optional)

        ## Production Recommendations
        1. **Authentication**: Enable username/password authentication
        2. **TLS/SSL**: Configure certificates for secure communication
        3. **Topic ACL**: Implement topic access control lists (ACL)
        4. **Persistence**: Configure appropriate retention policies
        5. **Monitoring**: Enable logging and set up alerts
        6. **Resource Limits**: Set appropriate memory and connection limits

        ## Example MQTT Commands

        ### Subscribe to a topic
        ```bash
        mosquitto_sub -h mqtt-broker -t 'rtu/sensor/sensor-001/#' -v
        ```

        ### Publish a message
        ```bash
        mosquitto_pub -h mqtt-broker -t 'rtu/test' -m 'Hello MQTT'
        ```

        ### Using with TLS
        ```bash
        mosquitto_sub -h mqtt-broker -p 8883 \
          --cafile ca.crt \
          --cert client.crt \
          --key client.key \
          -t 'rtu/sensor/#'
        ```

        ## Performance Tuning
        - Adjust `max_connections` for higher throughput
        - Configure `max_queued_messages` based on QoS requirements
        - Enable persistence only if data durability is needed
        - Monitor memory usage with `docker stats`

    - version: "2.0.18"
      channels:
        - stable
        - candidate
      references:
        container: "2.0.18"
      replaces: "2.0.15"
      readme: *mosquitto-readme

  defaults:
    config:
      envVars:
        TZ: "UTC"
        ALLOW_ANONYMOUS: "true"
        MAX_CONNECTIONS: "-1"
        MAX_KEEPALIVE: "60"
        MAX_QUEUED_MESSAGES: "1000"
        PERSISTENCE: "true"

      ports:
        - "1883:1883"
        - "8883:8883"
        - "9001:9001"

      resources:
        requests:
          memory: "64m"
          cpu: "0.1"
        limits:
          memory: "512m"
          cpu: "1"

      volumes:
        - name: data
          mount:
            path: /mosquitto/data
        - name: logs
          mount:
            path: /mosquitto/log
        - name: config
          mount:
            path: /mosquitto/config

    configSchema:
      $schema: "http://json-schema.org/draft-07/schema#"
      type: object
      title: Mosquitto Broker Configuration
      description: Configuration options for the Mosquitto MQTT broker
      properties:
        envVars:
          type: object
          title: Environment Variables
          description: Environment variables for configuring the Mosquitto broker
          properties:
            TZ:
              type: string
              description: Timezone for the broker container
              default: "UTC"
            ALLOW_ANONYMOUS:
              type: boolean
              description: Allow anonymous MQTT connections
              default: true
            MAX_CONNECTIONS:
              type: integer
              description: Maximum concurrent connections (-1 for unlimited)
              minimum: -1
              default: -1
            MAX_QUEUED_MESSAGES:
              type: integer
              description: Maximum queued messages per client
              minimum: 1
              default: 1000
            PERSISTENCE:
              type: boolean
              description: Enable message persistence
              default: true
            MAX_KEEPALIVE:
              type: integer
              description: Maximum keep-alive interval in seconds
              minimum: 1
              default: 60
        ports:
          type: array
          title: Port Mappings
          description: List of port mappings for the Mosquitto broker
          items:
            type: string
            pattern: "^[0-9]+:[0-9]+$"
            default: "1883:1883"
        volumes:
          type: array
          title: Volume Mounts
          description: List of volume mounts for persistent storage and configuration
          items:
            type: object
            properties:
              name:
                type: string
                description: Name of the volume
                default: "data"
              mount:
                type: object
                properties:
                  path:
                    type: string
                    description: Path where the volume is mounted in the container
                    default: "/mosquitto/data"
        resources:
          type: object
          title: Resource Limits
          description: CPU and memory resource requests and limits for the Mosquitto broker
          properties:
            requests:
              type: object
              properties:
                memory:
                  type: string
                  description: Memory request (e.g., "64m")
                cpu:
                  type: string
                  description: CPU request (e.g., "0.1")
            limits:
              type: object
              properties:
                memory:
                  type: string
                  description: Memory limit (e.g., "512m")
                cpu:
                  type: string
                  description: CPU limit (e.g., "1")
        runAs:
          type: string
          title: Access & permissions
          description: >-
            Prevents this workload from modifying critical host operating system files.
            We recommend keeping rootless mode enabled. Use "flightctl" for rootless
            (recommended); use "root" to disable system integrity protection.
          default: root
          enum:
            - flightctl
            - root
