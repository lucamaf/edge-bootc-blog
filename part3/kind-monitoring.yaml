kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
kubeadmConfigPatches:
- |
  kind: ClusterConfiguration
  apiServer:
    extraArgs:
      "service-node-port-range": "3000-32767"
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30000
    hostPort: 30000
  - containerPort: 31000
    hostPort: 31000
  - containerPort: 32000
    hostPort: 32000
  - containerPort: 32080
    hostPort: 32080
  - containerPort: 31080
    hostPort: 31080
  - containerPort: 30080
    hostPort: 30080
